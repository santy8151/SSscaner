[project]
name = "ssscanner"
version = "0.1.0"
description = "SSScanner modular MVP foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "scikit-learn>=1.5,<2", "numpy>=1.26,<3", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "services*", "packages*", "hardware*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests/mvp"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["apps/**/*.py", "services/**/*.py", "packages/**/*.py", "hardware/**/*.py", "tests/mvp/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
