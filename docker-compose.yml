version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8001}
        VITE_SCANNER_URL: ${VITE_SCANNER_URL:-ws://localhost:8002}
        VITE_ML_URL: ${VITE_ML_URL:-http://localhost:8003}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      scanner-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ssscaner-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./backend/services/api_gateway
      dockerfile: Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8001}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8003}
      SCANNER_SERVICE_URL: ${SCANNER_SERVICE_URL:-http://scanner-service:8002}
      MCP_SERVICE_URL: ${MCP_SERVICE_URL:-http://mcp-server:8005}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      scanner-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ssscaner-network
    volumes:
      - ./backend/services/api_gateway:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').status\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  auth-service:
    build:
      context: ./backend/services/auth_service
      dockerfile: Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    environment:
      SERVICE_NAME: auth-service
      JWT_SECRET: ${JWT_SECRET:-ssscaner-secret-key-change-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:password@postgres:5432/ssscaner_db}
      REDIS_URL: ${REDIS_URL_AUTH:-redis://redis:6379/1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ssscaner-network
    volumes:
      - ./backend/services/auth_service:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health').status\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  scanner-service:
    build:
      context: ./backend/services/scanner_service
      dockerfile: Dockerfile
    ports:
      - "${SCANNER_SERVICE_PORT:-8002}:8002"
    environment:
      SERVICE_NAME: scanner-service
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:password@postgres:5432/ssscaner_db}
      REDIS_URL: ${REDIS_URL_SCANNER:-redis://redis:6379/2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ssscaner-network
    volumes:
      - ./backend/services/scanner_service:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health').status\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  ml-service:
    build:
      context: ./backend/services/ml_service
      dockerfile: Dockerfile
    ports:
      - "${ML_SERVICE_PORT:-8003}:8003"
    environment:
      SERVICE_NAME: ml-service
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:password@postgres:5432/ssscaner_db}
      REDIS_URL: ${REDIS_URL_ML:-redis://redis:6379/3}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - ssscaner-network
    volumes:
      - ./backend/services/ml_service:/app
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health').status\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 25s

  mcp-server:
    build:
      context: ./backend/services/mcp_server
      dockerfile: Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8005}:8005"
    environment:
      SERVICE_NAME: mcp-server
      SCANNER_SERVICE_URL: ${SCANNER_SERVICE_URL:-http://scanner-service:8002}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8003}
    depends_on:
      scanner-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ssscaner-network
    volumes:
      - ./backend/services/mcp_server:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health').status\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-0.0.0.0:11434}
    networks:
      - ssscaner-network
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:11434 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ssscaner_db}
    networks:
      - ssscaner-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ssscaner_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ssscaner-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ssscaner.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    networks:
      - ssscaner-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  ssscaner-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  ollama-data:
