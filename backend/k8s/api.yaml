apiVersion: v1
kind: Namespace
metadata:
  name: ssscaner

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssscaner-config
  namespace: ssscaner
data:
  SERVICE_NAME: "api-gateway"
  AUTH_SERVICE_URL: "http://auth-service:8001"
  ML_SERVICE_URL: "http://ml-service:8003"
  SCANNER_SERVICE_URL: "http://scanner-service:8002"
  OLLAMA_URL: "http://ollama:11434"
  DATABASE_URL: "postgresql://admin:password@postgres:5432/ssscaner_db"
  REDIS_URL: "redis://redis:6379/0"

---
apiVersion: v1
kind: Secret
metadata:
  name: ssscaner-secrets
  namespace: ssscaner
type: Opaque
stringData:
  JWT_SECRET: "ssscaner-secret-key-change-in-production"
  DJANGO_SECRET_KEY: "django-insecure-change-in-production"
  POSTGRES_PASSWORD: "password"
  HUGGINGFACE_API_KEY: ""
  NANOBANANA_API_KEY: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ssscaner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ssscaner/api-gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: ssscaner-config
              key: SERVICE_NAME
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ssscaner-config
              key: AUTH_SERVICE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ssscaner
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: ssscaner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
      - name: ml-service
        image: ssscaner/ml-service:latest
        ports:
        - containerPort: 8003
        env:
        - name: ML_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ssscaner-config
              key: ML_SERVICE_URL
        - name: OLLAMA_URL
          valueFrom:
            configMapKeyRef:
              name: ssscaner-config
              key: OLLAMA_URL
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: ssscaner
spec:
  selector:
    app: ml-service
  ports:
  - protocol: TCP
    port: 8003
    targetPort: 8003

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ssscaner
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ssscaner-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "ssscaner_db"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ssscaner
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ssscaner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ssscaner
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: ssscaner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
